services:
  web:
    build: .
    image: brianindex-client:latest
    container_name: brianindex-client
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://brian.aselaboratory.com/api/items}
    expose:
      - "80"
    # Uncomment to test directly on the server via http://127.0.0.1:8080
    # ports:
    #   - "127.0.0.1:8080:80"
    networks:
      - tunnel_net

# Reuses the existing cloudflared container from ~/projects/cloudflare.
# In Zero Trust -> Tunnels -> Public Hostname, point the client hostname to:
#   HTTP  ->  brianindex-client:80
networks:
  tunnel_net:
    external: true
